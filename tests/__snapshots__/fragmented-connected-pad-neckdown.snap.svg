.002631578947368421"/></g><g><rect data-type="rect" data-label="" data-x="1.49625" data-y="0" x="771.1075000000001" y="40" width="342" height="380" fill="transparent" stroke="#cbd5e1" stroke-width="0.002631578947368421"/></g><g><rect data-type="rect" data-label="" data-x="1.49625" data-y="-0.1" x="828.1075000000001" y="249" width="228" height="38" fill="rgba(226, 232, 240, 0.85)" stroke="#64748b" stroke-width="0.002631578947368421"/></g><g><rect data-type="rect" data-label="" data-x="1.49625" data-y="0" x="828.1075000000001" y="211" width="228" height="38" fill="rgba(203, 213, 225, 0.85)" stroke="#64748b" stroke-width="0.002631578947368421"/></g><g><rect data-type="rect" data-label="" data-x="1.49625" data-y="0.1" x="828.1075000000001" y="173" width="228" height="38" fill="rgba(226, 232, 240, 0.85)" stroke="#64748b" stroke-width="0.002631578947368421"/></g><g><rect data-type="rect" data-label="" data-x="1.49625" data-y="0" x="828.1075000000001" y="173" width="228" height="114" fill="transparent" stroke="#334155" stroke-width="0.002631578947368421"/></g><g><rect data-type="rect" data-label="" data-x="1.6462495000000001" data-y="0.01" x="942.1075000000001" y="173" width="113.99962000000005" height="106.39999999999998" fill="#16a34a" stroke="#166534" stroke-width="0.002631578947368421"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0.01" cx="373.5325" cy="226.2" r="4.5600000000000005" fill="#0f172a" stroke="#0f172a" stroke-width="0.002631578947368421"/><circle data-type="circle" data-label="" data-x="1.49625" data-y="0.01" cx="942.1075000000001" cy="226.2" r="4.5600000000000005" fill="#0f172a" stroke="#0f172a" stroke-width="0.002631578947368421"/><text data-type="text" data-label="EXPECTED TERMINAL SEGMENT" data-x="0" data-y="0.42" x="373.5325" y="70.4" fill="#0f172a" font-size="24.7" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">EXPECTED TERMINAL SEGMENT</text><text data-type="text" data-label="ALL 3 ROWS = ONE PHYSICAL PAD" data-x="0" data-y="0.31" x="373.5325" y="112.2" fill="#334155" font-size="19" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">ALL 3 ROWS = ONE PHYSICAL PAD</text><text data-type="text" data-label="TERMINAL" data-x="0" data-y="0.19" x="373.5325" y="157.8" fill="#0f172a" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TERMINAL</text><text data-type="text" data-label="fragment 1" data-x="-0.23" data-y="-0.1" x="286.13250000000005" y="268" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 1</text><text data-type="text" data-label="fragment 2" data-x="-0.23" data-y="0" x="286.13250000000005" y="230" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 2</text><text data-type="text" data-label="fragment 3" data-x="-0.23" data-y="0.1" x="286.13250000000005" y="192" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 3</text><text data-type="text" data-label="BLUE INPUT: 0.1500 mm FITS" data-x="0" data-y="-0.34" x="373.5325" y="359.20000000000005" fill="#1d4ed8" font-size="20.9" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">BLUE INPUT: 0.1500 mm FITS</text><text data-type="text" data-label="FIXED OUTPUT USES THE COMPLETE PAD" data-x="1.49625" data-y="0.42" x="942.1075000000001" y="70.4" fill="#0f172a" font-size="24.7" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">FIXED OUTPUT USES THE COMPLETE PAD</text><text data-type="text" data-label="ALL 3 ROWS = ONE PHYSICAL PAD" data-x="1.49625" data-y="0.31" x="942.1075000000001" y="112.2" fill="#334155" font-size="19" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">ALL 3 ROWS = ONE PHYSICAL PAD</text><text data-type="text" data-label="TERMINAL" data-x="1.49625" data-y="0.19" x="942.1075000000001" y="157.8" fill="#0f172a" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TERMINAL</text><text data-type="text" data-label="fragment 1" data-x="1.26625" data-y="-0.1" x="854.7075" y="268" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 1</text><text data-type="text" data-label="fragment 2" data-x="1.26625" data-y="0" x="854.7075" y="230" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 2</text><text data-type="text" data-label="fragment 3" data-x="1.26625" data-y="0.1" x="854.7075" y="192" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 3</text><text data-type="text" data-label="GREEN OUTPUT: 0.2800 mm ≥ 0.1500 mm MINIMUM" data-x="1.49625" data-y="-0.34" x="942.1075000000001" y="359.20000000000005" fill="#166534" font-size="20.9" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">GREEN OUTPUT: 0.2800 mm ≥ 0.1500 mm MINIMUM</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="460" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1400" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1400');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '460');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":380,"c":0,"e":373.5325,"b":0,"d":-380,"f":230};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
