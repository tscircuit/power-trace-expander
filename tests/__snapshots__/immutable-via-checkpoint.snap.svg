ata-points="6.292999999999999,0 8.293,0" data-type="line" data-label="" points="637.5438086939687,266.7939539161584 775.0208151805598,266.7939539161584" fill="none" stroke="#dc2626" stroke-width="10.31077548649434"/></g><g><polyline data-points="8.293,0 9.293,-2" data-type="line" data-label="" points="775.0208151805598,266.7939539161584 843.7593184238555,404.27096040274955" fill="none" stroke="#dc2626" stroke-width="10.31077548649434"/></g><g><polyline data-points="12.849999999999998,2 13.849999999999998,0" data-type="line" data-label="" points="1088.2621744602577,129.3169474295672 1157.0006777035533,266.7939539161584" fill="none" stroke="#2563eb" stroke-width="10.31077548649434"/></g><g><polyline data-points="13.849999999999998,0 15.849999999999998,0" data-type="line" data-label="" points="1157.0006777035533,266.7939539161584 1294.4776841901444,266.7939539161584" fill="none" stroke="#2563eb" stroke-width="10.31077548649434"/></g><g><polyline data-points="15.849999999999998,0 16.849999999999998,2" data-type="line" data-label="" points="1294.4776841901444,266.7939539161584 1363.2161874334402,129.3169474295672" fill="none" stroke="#2563eb" stroke-width="10.31077548649434"/></g><g><polyline data-points="14.849999999999998,0 15.849999999999998,0" data-type="line" data-label="" points="1225.739180946849,266.7939539161584 1294.4776841901444,266.7939539161584" fill="none" stroke="#64748b" stroke-width="10.31077548649434" stroke-dasharray="0.08 0.08"/></g><g><polyline data-points="12.849999999999998,-2 16.849999999999998,-2" data-type="line" data-label="" points="1088.2621744602577,404.27096040274955 1363.2161874334402,404.27096040274955" fill="none" stroke="#dc2626" stroke-width="10.31077548649434"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="204.9724077839095" cy="266.7939539161584" r="20.62155097298868" fill="#fbbf24" stroke="#92400e" stroke-width="0.014547887323943657"/><circle data-type="circle" data-label="" data-x="7.292999999999999" data-y="0" cx="706.2823119372642" cy="266.7939539161584" r="20.62155097298868" fill="#fbbf24" stroke="#92400e" stroke-width="0.014547887323943657"/><circle data-type="circle" data-label="" data-x="14.849999999999998" data-y="0" cx="1225.739180946849" cy="266.7939539161584" r="20.62155097298868" fill="#fbbf24" stroke="#92400e" stroke-width="0.014547887323943657"/><text data-type="text" data-label="Blue: POWER; red: SECOND; gold: imported via" data-x="-2.4" data-y="-2.6" x="40.00000000000006" y="445.51406234872695" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Blue: POWER; red: SECOND; gold: imported via</text><text data-type="text" data-label="Existing POWER collision remains" data-x="-2.4" data-y="-3.1" x="40.00000000000006" y="479.88331397037473" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Existing POWER collision remains</text><text data-type="text" data-label="Affected vias: 1; violation pairs: 6" data-x="-2.4" data-y="-3.6" x="40.00000000000006" y="514.2525655920225" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Affected vias: 1; violation pairs: 6</text><text data-type="text" data-label="Baseline debt does not permit new collisions" data-x="-2.4" data-y="-4.1" x="40.00000000000006" y="548.6218172136703" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Baseline debt does not permit new collisions</text><text data-type="text" data-label="Blue: POWER; red: SECOND; gold: imported via" data-x="4.892999999999999" data-y="-2.6" x="541.3099041533548" y="445.51406234872695" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Blue: POWER; red: SECOND; gold: imported via</text><text data-type="text" data-label="New SECOND collider replaces POWER" data-x="4.892999999999999" data-y="-3.1" x="541.3099041533548" y="479.88331397037473" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">New SECOND collider replaces POWER</text><text data-type="text" data-label="Affected vias: 1; violation pairs: 6" data-x="4.892999999999999" data-y="-3.6" x="541.3099041533548" y="514.2525655920225" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Affected vias: 1; violation pairs: 6</text><text data-type="text" data-label="Equal counts hide a different offending object" data-x="4.892999999999999" data-y="-4.1" x="541.3099041533548" y="548.6218172136703" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Equal counts hide a different offending object</text><text data-type="text" data-label="Blue: POWER; red: SECOND; gold: imported via" data-x="12.449999999999998" data-y="-2.6" x="1060.7667731629394" y="445.51406234872695" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Blue: POWER; red: SECOND; gold: imported via</text><text data-type="text" data-label="Existing POWER collision remains" data-x="12.449999999999998" data-y="-3.1" x="1060.7667731629394" y="479.88331397037473" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Existing POWER collision remains</text><text data-type="text" data-label="Affected vias: 1; violation pairs: 6" data-x="12.449999999999998" data-y="-3.6" x="1060.7667731629394" y="514.2525655920225" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Affected vias: 1; violation pairs: 6</text><text data-type="text" data-label="New collision signature triggers rollback" data-x="12.449999999999998" data-y="-4.1" x="1060.7667731629394" y="548.6218172136703" fill="#334155" font-size="15.122470713525031" font-family="sans-serif" text-anchor="start" dominant-baseline="central">New collision signature triggers rollback</text><text data-type="text" data-label="Accepted input" data-x="0.504" data-y="2.51645" x="239.61661341853048" y="93.8169474295672" fill="black" font-size="35.5" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Accepted input</text><text data-type="text" data-label="Rejected replacement" data-x="7.9289999999999985" data-y="2.51645" x="750.0000000000002" y="93.8169474295672" fill="black" font-size="35.5" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Rejected replacement</text><text data-type="text" data-label="Accepted output" data-x="15.353999999999996" data-y="2.51645" x="1260.38338658147" y="93.8169474295672" fill="black" font-size="35.5" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Accepted output</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="650" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1500" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1500');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '650');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":68.7385032432956,"c":0,"e":204.9724077839095,"b":0,"d":-68.7385032432956,"f":266.7939539161584};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>