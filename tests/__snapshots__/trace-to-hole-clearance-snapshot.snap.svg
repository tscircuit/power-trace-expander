="262.2950819672131" height="196.7213114754098" fill="transparent" stroke="#cbd5e1" stroke-width="0.030500000000000003"/></g><g><rect data-type="rect" data-label="" data-x="20" data-y="0" x="751.4754098360654" y="107.21311475409838" width="262.29508196721326" height="196.7213114754098" fill="transparent" stroke="#cbd5e1" stroke-width="0.030500000000000003"/></g><g><rect data-type="rect" data-label="" data-x="30" data-y="0" x="1079.3442622950818" y="107.21311475409838" width="262.29508196721326" height="196.7213114754098" fill="transparent" stroke="#cbd5e1" stroke-width="0.030500000000000003"/></g><circle data-type="circle" data-label="" data-x="0" data-y="-1.5" cx="226.88524590163928" cy="254.75409836065575" r="32.78688524590164" fill="#e2e8f0" stroke="#475569" stroke-width="0.030500000000000003"/><circle data-type="circle" data-label="" data-x="0" data-y="1.5" cx="226.88524590163928" cy="156.39344262295083" r="32.78688524590164" fill="#e2e8f0" stroke="#475569" stroke-width="0.030500000000000003"/><circle data-type="circle" data-label="" data-x="10" data-y="-1.5" cx="554.7540983606557" cy="254.75409836065575" r="32.78688524590164" fill="#e2e8f0" stroke="#475569" stroke-width="0.030500000000000003"/><circle data-type="circle" data-label="" data-x="10" data-y="1.5" cx="554.7540983606557" cy="156.39344262295083" r="32.78688524590164" fill="#e2e8f0" stroke="#475569" stroke-width="0.030500000000000003"/><circle data-type="circle" data-label="" data-x="20" data-y="-1.5" cx="882.622950819672" cy="254.75409836065575" r="32.78688524590164" fill="#e2e8f0" stroke="#475569" stroke-width="0.030500000000000003"/><circle data-type="circle" data-label="" data-x="20" data-y="1.5" cx="882.622950819672" cy="156.39344262295083" r="32.78688524590164" fill="#e2e8f0" stroke="#475569" stroke-width="0.030500000000000003"/><circle data-type="circle" data-label="" data-x="30" data-y="-1.5" cx="1210.4918032786884" cy="254.75409836065575" r="32.78688524590164" fill="#e2e8f0" stroke="#475569" stroke-width="0.030500000000000003"/><circle data-type="circle" data-label="" data-x="30" data-y="1.5" cx="1210.4918032786884" cy="156.39344262295083" r="32.78688524590164" fill="#e2e8f0" stroke="#475569" stroke-width="0.030500000000000003"/><text data-type="text" data-label="Neck width: 0.800 mm" data-x="10" data-y="-2.8" x="554.7540983606557" y="297.37704918032784" fill="black" font-size="8.19672131147541" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Neck width: 0.800 mm</text><text data-type="text" data-label="Neck width: 0.575 mm" data-x="20" data-y="-2.8" x="882.622950819672" y="297.37704918032784" fill="black" font-size="8.19672131147541" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Neck width: 0.575 mm</text><text data-type="text" data-label="Neck width: 0.175 mm" data-x="30" data-y="-2.8" x="1210.4918032786884" y="297.37704918032784" fill="black" font-size="8.19672131147541" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Neck width: 0.175 mm</text><text data-type="text" data-label="Input: 0.15 mm trace" data-x="0" data-y="3.95" x="226.88524590163928" y="76.06557377049182" fill="black" font-size="31.147540983606557" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Input: 0.15 mm trace</text><text data-type="text" data-label="0.0 mm clearance" data-x="10" data-y="3.95" x="554.7540983606557" y="76.06557377049182" fill="black" font-size="31.147540983606557" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">0.0 mm clearance</text><text data-type="text" data-label="0.2 mm clearance" data-x="20" data-y="3.95" x="882.622950819672" y="76.06557377049182" fill="black" font-size="31.147540983606557" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">0.2 mm clearance</text><text data-type="text" data-label="0.4 mm clearance" data-x="30" data-y="3.95" x="1210.4918032786884" y="76.06557377049182" fill="black" font-size="31.147540983606557" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">0.4 mm clearance</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="380" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1400" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1400');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '380');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":32.78688524590164,"c":0,"e":226.88524590163928,"b":0,"d":-32.78688524590164,"f":205.5737704918033};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>