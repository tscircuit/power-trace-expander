<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-5,0 -4.230769230769231,0" data-type="line" data-label="" points="40,365.2252906005146 83.07692307692307,365.2252906005146" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-4.230769230769231,0 -3.4615384615384617,0" data-type="line" data-label="" points="83.07692307692307,365.2252906005146 126.15384615384613,365.2252906005146" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-3.4615384615384617,0 -2.692307692307692,0" data-type="line" data-label="" points="126.15384615384613,365.2252906005146 169.23076923076925,365.2252906005146" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-2.692307692307692,0 -0.7999999999999998,-0.3999999999999999" data-type="line" data-label="" points="169.23076923076925,365.2252906005146 275.2,387.6252906005146" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-0.7999999999999998,-0.3999999999999999 4.6,-0.3999999999999999" data-type="line" data-label="" points="275.2,387.6252906005146 577.5999999999999,387.6252906005146" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="4.6,-0.3999999999999999 5,0" data-type="line" data-label="" points="577.5999999999999,387.6252906005146 600,365.2252906005146" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><rect data-type="rect" data-label="" data-x="-1.0875693444439798" data-y="0.6928580859111606" x="239.1368213574256" y="309.1746037774353" width="39.91859070742311" height="34.50126802410847" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="-0.5437846722219901" data-y="0.9464290429555803" x="269.58876300185705" y="294.97463018294786" width="39.91859070742311" height="34.50126802410847" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="1.2" x="300.0407046462885" y="280.7746565884604" width="39.91859070742305" height="34.50126802410841" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0.5437846722219901" data-y="1.4535709570444197" x="330.4926462907199" y="266.57468299397283" width="39.91859070742311" height="34.501268024108526" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="1.0875693444439796" data-y="1.707141914088839" x="360.9445879351513" y="252.37470939948534" width="39.918590707423164" height="34.50126802410847" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":56,"c":0,"e":320,"b":0,"d":-56,"f":365.2252906005146};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>