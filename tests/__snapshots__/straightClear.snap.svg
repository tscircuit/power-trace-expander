<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-5,-2 -4.375,-1.625" data-type="line" data-label="" points="40,404 75,383" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-4.375,-1.625 -3.75,-1.25" data-type="line" data-label="" points="75,383 110,362" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-3.75,-1.25 -3.125,-0.875" data-type="line" data-label="" points="110,362 145,341" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-3.125,-0.875 -2.5,-0.5" data-type="line" data-label="" points="145,341 180,320" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-2.5,-0.5 -1.875,-0.125" data-type="line" data-label="" points="180,320 215,299" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-1.875,-0.125 -1.25,0.25" data-type="line" data-label="" points="215,299 250,278" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-1.25,0.25 -0.625,0.625" data-type="line" data-label="" points="250,278 285,257" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-0.625,0.625 0,1" data-type="line" data-label="" points="285,257 320,236" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="0,1 0.625,0.625" data-type="line" data-label="" points="320,236 355,257" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="0.625,0.625 1.25,0.25" data-type="line" data-label="" points="355,257 390,278" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="1.25,0.25 1.875,-0.125" data-type="line" data-label="" points="390,278 425,299" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="1.875,-0.125 2.5,-0.5" data-type="line" data-label="" points="425,299 460,320" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="2.5,-0.5 3.125,-0.875" data-type="line" data-label="" points="460,320 495,341" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="3.125,-0.875 3.75,-1.25" data-type="line" data-label="" points="495,341 530,362" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="3.75,-1.25 4.375,-1.625" data-type="line" data-label="" points="530,362 565,383" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="4.375,-1.625 5,-2" data-type="line" data-label="" points="565,383 600,404" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":56,"c":0,"e":320,"b":0,"d":-56,"f":292};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>