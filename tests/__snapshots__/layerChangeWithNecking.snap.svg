"29.93710691823898" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.01892857142857143"/></g><g><rect data-type="rect" data-label="" data-x="-5" data-y="0" x="46.60377358490568" y="306.79245283018867" width="18.490566037735817" height="26.41509433962267" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.01892857142857143"/></g><g><rect data-type="rect" data-label="" data-x="-5" data-y="0.7" x="40.000000000000014" y="277.7358490566038" width="31.698113207547152" height="10.566037735849022" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.01892857142857143"/></g><g><rect data-type="rect" data-label="" data-x="-5" data-y="-0.7" x="40.000000000000014" y="351.6981132075472" width="31.698113207547152" height="10.566037735849022" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.01892857142857143"/></g><g><rect data-type="rect" data-label="" data-x="5" data-y="0" x="574.9056603773586" y="306.79245283018867" width="18.490566037735903" height="26.41509433962267" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.01892857142857143"/></g><g><rect data-type="rect" data-label="" data-x="5" data-y="0.7" x="568.3018867924529" y="277.7358490566038" width="31.69811320754718" height="10.566037735849022" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.01892857142857143"/></g><g><rect data-type="rect" data-label="" data-x="5" data-y="-0.7" x="568.3018867924529" y="351.6981132075472" width="31.69811320754718" height="10.566037735849022" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.01892857142857143"/></g><circle data-type="circle" data-label="" data-x="-1.75" data-y="0" cx="227.54716981132077" cy="320" r="15.849056603773583" fill="#d4a017" stroke="#7a5700" stroke-width="0.01892857142857143"/><circle data-type="circle" data-label="" data-x="4.25" data-y="0" cx="544.5283018867924" cy="320" r="15.849056603773583" fill="#d4a017" stroke="#7a5700" stroke-width="0.01892857142857143"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":52.83018867924528,"c":0,"e":320,"b":0,"d":-52.83018867924528,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>