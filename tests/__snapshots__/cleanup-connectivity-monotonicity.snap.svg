oints="1286.0280221570547,238.12308569566633 1397.0739654610625,238.12308569566633" fill="none" stroke="#777" stroke-width="59.22450309547085"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="1" x="143.6428804170739" y="127.0771423916585" width="148.0612577386771" height="74.03062886933856" fill="rgba(245,158,11,0.3)" stroke="#b45309" stroke-width="0.013507922535211266"/></g><g><rect data-type="rect" data-label="" data-x="6.1875" data-y="1" x="601.7073965461062" y="127.0771423916585" width="148.0612577386771" height="74.03062886933856" fill="rgba(245,158,11,0.3)" stroke="#b45309" stroke-width="0.013507922535211266"/></g><g><rect data-type="rect" data-label="" data-x="13.93125" data-y="1" x="1174.9820788530465" y="127.0771423916585" width="148.0612577386771" height="74.03062886933856" fill="rgba(245,158,11,0.3)" stroke="#b45309" stroke-width="0.013507922535211266"/></g><circle data-type="circle" data-label="" data-x="-2" data-y="0" cx="69.61225154773535" cy="238.12308569566633" r="5.182144020853699" fill="#0f172a" stroke="black" stroke-width="0.013507922535211266"/><circle data-type="circle" data-label="" data-x="2" data-y="0" cx="365.7347670250896" cy="238.12308569566633" r="5.182144020853699" fill="#0f172a" stroke="black" stroke-width="0.013507922535211266"/><circle data-type="circle" data-label="" data-x="0" data-y="1" cx="217.67350928641247" cy="164.09245682632778" r="5.182144020853699" fill="#0f172a" stroke="black" stroke-width="0.013507922535211266"/><circle data-type="circle" data-label="" data-x="4.1875" data-y="0" cx="527.6767676767677" cy="238.12308569566633" r="5.182144020853699" fill="#0f172a" stroke="black" stroke-width="0.013507922535211266"/><circle data-type="circle" data-label="" data-x="8.1875" data-y="0" cx="823.7992831541219" cy="238.12308569566633" r="5.182144020853699" fill="#0f172a" stroke="black" stroke-width="0.013507922535211266"/><circle data-type="circle" data-label="" data-x="6.1875" data-y="1" cx="675.7380254154448" cy="164.09245682632778" r="5.182144020853699" fill="#0f172a" stroke="black" stroke-width="0.013507922535211266"/><circle data-type="circle" data-label="" data-x="11.93125" data-y="0" cx="1100.9514499837082" cy="238.12308569566633" r="5.182144020853699" fill="#0f172a" stroke="black" stroke-width="0.013507922535211266"/><circle data-type="circle" data-label="" data-x="15.93125" data-y="0" cx="1397.0739654610625" cy="238.12308569566633" r="5.182144020853699" fill="#0f172a" stroke="black" stroke-width="0.013507922535211266"/><circle data-type="circle" data-label="" data-x="13.93125" data-y="1" cx="1249.0127077223851" cy="164.09245682632778" r="5.182144020853699" fill="#0f172a" stroke="black" stroke-width="0.013507922535211266"/><text data-type="text" data-label="All three terminals share copper" data-x="-2.4" data-y="-1" x="39.99999999999994" y="312.15371456500486" fill="#334155" font-size="18.50765721733464" font-family="sans-serif" text-anchor="start" dominant-baseline="central">All three terminals share copper</text><text data-type="text" data-label="Physical terminal groups: 1" data-x="-2.4" data-y="-1.5" x="39.99999999999994" y="349.1690289996742" fill="#334155" font-size="18.50765721733464" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Physical terminal groups: 1</text><text data-type="text" data-label="Shortcut keeps endpoints, loses branch pad" data-x="3.7875" data-y="-1" x="498.06451612903226" y="312.15371456500486" fill="#334155" font-size="18.50765721733464" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Shortcut keeps endpoints, loses branch pad</text><text data-type="text" data-label="Physical terminal groups: 2" data-x="3.7875" data-y="-1.5" x="498.06451612903226" y="349.1690289996742" fill="#334155" font-size="18.50765721733464" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Physical terminal groups: 2</text><text data-type="text" data-label="Rollback retains the pad T-junction" data-x="11.53125" data-y="-1" x="1071.3391984359728" y="312.15371456500486" fill="#334155" font-size="18.50765721733464" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Rollback retains the pad T-junction</text><text data-type="text" data-label="Physical terminal groups: 1" data-x="11.53125" data-y="-1.5" x="1071.3391984359728" y="349.1690289996742" fill="#334155" font-size="18.50765721733464" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Physical terminal groups: 1</text><text data-type="text" data-label="Connected input" data-x="0" data-y="1.97953125" x="217.67350928641247" y="91.5771423916585" fill="black" font-size="35.5" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Connected input</text><text data-type="text" data-label="Rejected shortcut" data-x="6.9375" data-y="1.97953125" x="731.2609970674487" y="91.5771423916585" fill="black" font-size="35.5" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Rejected shortcut</text><text data-type="text" data-label="Accepted output" data-x="14.15625" data-y="1.97953125" x="1265.6695992179866" y="91.5771423916585" fill="black" font-size="35.5" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Accepted output</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="450" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1500" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1500');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '450');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":74.03062886933856,"c":0,"e":217.67350928641247,"b":0,"d":-74.03062886933856,"f":238.12308569566633};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>