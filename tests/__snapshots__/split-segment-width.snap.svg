<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,1 3,1" data-type="line" data-label="" points="41.833570715256315,144.26783229376423 261.86205654601116,144.26783229376423" fill="none" stroke="#64748b" stroke-width="14.668565722050324"/></g><g><polyline data-points="0,0 1,0" data-type="line" data-label="" points="41.833570715256315,217.61066090401584 115.17639932550793,217.61066090401584" fill="none" stroke="#2563eb" stroke-width="14.668565722050324"/></g><g><polyline data-points="1,0 2,0" data-type="line" data-label="" points="115.17639932550793,217.61066090401584 188.51922793575955,217.61066090401584" fill="none" stroke="#2563eb" stroke-width="14.668565722050324"/></g><g><polyline data-points="2,0 3,0" data-type="line" data-label="" points="188.51922793575955,217.61066090401584 261.86205654601116,217.61066090401584" fill="none" stroke="#2563eb" stroke-width="14.668565722050324"/></g><g><polyline data-points="8.48375,1 11.48375,1" data-type="line" data-label="" points="664.0557929374785,144.26783229376423 884.0842787682334,144.26783229376423" fill="none" stroke="#64748b" stroke-width="58.6742628882013"/></g><g><polyline data-points="8.48375,0 9.48375,0" data-type="line" data-label="" points="664.0557929374785,217.61066090401584 737.3986215477302,217.61066090401584" fill="none" stroke="#2563eb" stroke-width="58.6742628882013"/></g><g><polyline data-points="9.48375,0 10.48375,0" data-type="line" data-label="" points="737.3986215477302,217.61066090401584 810.7414501579817,217.61066090401584" fill="none" stroke="#2563eb" stroke-width="58.6742628882013"/></g><g><polyline data-points="10.48375,0 11.48375,0" data-type="line" data-label="" points="810.7414501579817,217.61066090401584 884.0842787682334,217.61066090401584" fill="none" stroke="#2563eb" stroke-width="58.6742628882013"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="41.833570715256315" cy="217.61066090401584" r="1.8335707152562906" fill="#0f172a" stroke="black" stroke-width="0.013634598214285715"/><circle data-type="circle" data-label="" data-x="1" data-y="0" cx="115.17639932550793" cy="217.61066090401584" r="1.8335707152562906" fill="#0f172a" stroke="black" stroke-width="0.013634598214285715"/><circle data-type="circle" data-label="" data-x="2" data-y="0" cx="188.51922793575955" cy="217.61066090401584" r="1.8335707152562906" fill="#0f172a" stroke="black" stroke-width="0.013634598214285715"/><circle data-type="circle" data-label="" data-x="3" data-y="0" cx="261.86205654601116" cy="217.61066090401584" r="1.8335707152562906" fill="#0f172a" stroke="black" stroke-width="0.013634598214285715"/><circle data-type="circle" data-label="" data-x="8.48375" data-y="0" cx="664.0557929374785" cy="217.61066090401584" r="1.8335707152562906" fill="#0f172a" stroke="black" stroke-width="0.013634598214285715"/><circle data-type="circle" data-label="" data-x="9.48375" data-y="0" cx="737.3986215477302" cy="217.61066090401584" r="1.8335707152562906" fill="#0f172a" stroke="black" stroke-width="0.013634598214285715"/><circle data-type="circle" data-label="" data-x="10.48375" data-y="0" cx="810.7414501579817" cy="217.61066090401584" r="1.8335707152562906" fill="#0f172a" stroke="black" stroke-width="0.013634598214285715"/><circle data-type="circle" data-label="" data-x="11.48375" data-y="0" cx="884.0842787682334" cy="217.61066090401584" r="1.8335707152562906" fill="#0f172a" stroke="black" stroke-width="0.013634598214285715"/><text data-type="text" data-label="Input copper (gray)" data-x="0" data-y="-0.8" x="41.833570715256315" y="276.2849237922171" fill="#334155" font-size="16.868850580357872" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Input copper (gray)</text><text data-type="text" data-label="Split copper (blue), inserted points (black)" data-x="0" data-y="-1.25" x="41.833570715256315" y="309.2891966668304" fill="#334155" font-size="16.868850580357872" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Split copper (blue), inserted points (black)</text><text data-type="text" data-label="Segment width remains 0.2 mm" data-x="0" data-y="-1.7000000000000002" x="41.833570715256315" y="342.2934695414436" fill="#334155" font-size="16.868850580357872" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Segment width remains 0.2 mm</text><text data-type="text" data-label="Endpoint width 0.8 mm belongs to the next segment" data-x="0" data-y="-2.1500000000000004" x="41.833570715256315" y="375.29774241605685" fill="#334155" font-size="16.868850580357872" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Endpoint width 0.8 mm belongs to the next segment</text><text data-type="text" data-label="Input copper (gray)" data-x="8.48375" data-y="-0.8" x="664.0557929374785" y="276.2849237922171" fill="#334155" font-size="16.868850580357872" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Input copper (gray)</text><text data-type="text" data-label="Split copper (blue), inserted points (black)" data-x="8.48375" data-y="-1.25" x="664.0557929374785" y="309.2891966668304" fill="#334155" font-size="16.868850580357872" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Split copper (blue), inserted points (black)</text><text data-type="text" data-label="Segment width remains 0.8 mm" data-x="8.48375" data-y="-1.7000000000000002" x="664.0557929374785" y="342.2934695414436" fill="#334155" font-size="16.868850580357872" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Segment width remains 0.8 mm</text><text data-type="text" data-label="Endpoint width 0.2 mm belongs to the next segment" data-x="8.48375" data-y="-2.1500000000000004" x="664.0557929374785" y="375.29774241605685" fill="#334155" font-size="16.868850580357872" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Endpoint width 0.2 mm belongs to the next segment</text><text data-type="text" data-label="Narrow segment, wide endpoint" data-x="3.3685" data-y="1.38176875" x="288.8888888888889" y="116.26783229376423" fill="black" font-size="28" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Narrow segment, wide endpoint</text><text data-type="text" data-label="Wide segment, narrow endpoint" data-x="11.852250000000002" data-y="1.38176875" x="911.1111111111111" y="116.26783229376423" fill="black" font-size="28" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Wide segment, narrow endpoint</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="500" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '500');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":73.34282861025162,"c":0,"e":41.833570715256315,"b":0,"d":-73.34282861025162,"f":217.61066090401584};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>