<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-4,0 -3.2,0" data-type="line" data-label="" points="96,338.1996925256597 140.79999999999998,338.1996925256597" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-3.2,0 -2.4,0" data-type="line" data-label="" points="140.79999999999998,338.1996925256597 185.6,338.1996925256597" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-2.4,0 -1.6,0" data-type="line" data-label="" points="185.6,338.1996925256597 230.39999999999998,338.1996925256597" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-1.6,0 -0.7999999999999998,0" data-type="line" data-label="" points="230.39999999999998,338.1996925256597 275.2,338.1996925256597" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-0.7999999999999998,0 0,0" data-type="line" data-label="" points="275.2,338.1996925256597 320,338.1996925256597" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="0,0 0.7999999999999998,0" data-type="line" data-label="" points="320,338.1996925256597 364.8,338.1996925256597" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="0.7999999999999998,0 1.5999999999999996,0" data-type="line" data-label="" points="364.8,338.1996925256597 409.59999999999997,338.1996925256597" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="1.5999999999999996,0 2.4000000000000004,0" data-type="line" data-label="" points="409.59999999999997,338.1996925256597 454.40000000000003,338.1996925256597" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="2.4000000000000004,0 3.2,0" data-type="line" data-label="" points="454.40000000000003,338.1996925256597 499.20000000000005,338.1996925256597" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="3.2,0 4,0" data-type="line" data-label="" points="499.20000000000005,338.1996925256597 544,338.1996925256597" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="-5,0.55 -3.8235294117647056,0.6499890187735617" data-type="line" data-label="" points="40,307.3996925256597 105.88235294117649,301.80030747434023" fill="none" stroke="#169c45" stroke-width="8.4"/></g><g><polyline data-points="-3.8235294117647056,0.6499890187735617 0.5882352941176467,0.6399017710314651" data-type="line" data-label="" points="105.88235294117649,301.80030747434023 352.94117647058823,302.3651933478977" fill="none" stroke="#169c45" stroke-width="8.4"/></g><g><polyline data-points="0.5882352941176467,0.6399017710314651 2.9411764705882346,0.6435332009884496" data-type="line" data-label="" points="352.94117647058823,302.3651933478977 484.7058823529411,302.16183327030654" fill="none" stroke="#169c45" stroke-width="8.4"/></g><g><polyline data-points="2.9411764705882346,0.6435332009884496 4.705882352941176,0.6399018431150382" data-type="line" data-label="" points="484.7058823529411,302.16183327030654 583.5294117647059,302.3651893112176" fill="none" stroke="#169c45" stroke-width="8.4"/></g><g><polyline data-points="4.705882352941176,0.6399018431150382 5,0.55" data-type="line" data-label="" points="583.5294117647059,302.3651893112176 600,307.3996925256597" fill="none" stroke="#169c45" stroke-width="8.4"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":56,"c":0,"e":320,"b":0,"d":-56,"f":338.1996925256597};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>