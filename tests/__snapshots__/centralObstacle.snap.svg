.20000000000005,289.20000000000005" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="2.2,1 2.6000000000000005,0.6000000000000001" data-type="line" data-label="" points="443.20000000000005,289.20000000000005 465.6,311.6" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="2.6000000000000005,0.6000000000000001 3,0.6000000000000001" data-type="line" data-label="" points="465.6,311.6 488,311.6" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="3,0.6000000000000001 3.4000000000000004,0.20000000000000018" data-type="line" data-label="" points="488,311.6 510.40000000000003,334.00000000000006" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="3.4000000000000004,0.20000000000000018 4.200000000000001,0.20000000000000018" data-type="line" data-label="" points="510.40000000000003,334.00000000000006 555.2,334.00000000000006" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="4.200000000000001,0.20000000000000018 4.000000000000001,0" data-type="line" data-label="" points="555.2,334.00000000000006 544,345.20000000000005" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="4.000000000000001,0 4.24,0" data-type="line" data-label="" points="544,345.20000000000005 557.44,345.20000000000005" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><polyline data-points="4.24,0 5,0" data-type="line" data-label="" points="557.44,345.20000000000005 600,345.20000000000005" fill="none" stroke="#169c45" stroke-width="44.800000000000004"/></g><g><rect data-type="rect" data-label="" data-x="-0.75" data-y="-0.6000000000000001" x="264" y="362.0000000000001" width="28" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="-0.25" data-y="-0.6000000000000001" x="292" y="362.0000000000001" width="28" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0.25" data-y="-0.6000000000000001" x="320" y="362.0000000000001" width="28" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0.75" data-y="-0.6000000000000001" x="348" y="362.0000000000001" width="28" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="-0.75" data-y="-1.1102230246251565e-16" x="264" y="328.40000000000003" width="28" height="33.60000000000002" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="-0.25" data-y="-1.1102230246251565e-16" x="292" y="328.40000000000003" width="28" height="33.60000000000002" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0.25" data-y="-1.1102230246251565e-16" x="320" y="328.40000000000003" width="28" height="33.60000000000002" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0.75" data-y="-1.1102230246251565e-16" x="348" y="328.40000000000003" width="28" height="33.60000000000002" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="-0.75" data-y="0.6" x="264" y="294.80000000000007" width="28" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="-0.25" data-y="0.6" x="292" y="294.80000000000007" width="28" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0.25" data-y="0.6" x="320" y="294.80000000000007" width="28" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0.75" data-y="0.6" x="348" y="294.80000000000007" width="28" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":56,"c":0,"e":320,"b":0,"d":-56,"f":345.20000000000005};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>