"33.60000000000002" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0.6000000000000001" data-y="-1.4" x="336.80000000000007" y="381.6" width="33.599999999999966" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="1.1999999999999997" data-y="-1.4" x="370.4" y="381.6" width="33.60000000000002" height="33.599999999999966" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="-1.2" data-y="-0.8000000000000003" x="236" y="348" width="33.60000000000002" height="33.60000000000002" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="-0.6000000000000001" data-y="-0.8000000000000003" x="269.6" y="348" width="33.599999999999966" height="33.60000000000002" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="-0.8000000000000003" x="303.2" y="348" width="33.60000000000002" height="33.60000000000002" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="0.6000000000000001" data-y="-0.8000000000000003" x="336.80000000000007" y="348" width="33.599999999999966" height="33.60000000000002" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="1.1999999999999997" data-y="-0.8000000000000003" x="370.4" y="348" width="33.60000000000002" height="33.60000000000002" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.017857142857142856"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":56,"c":0,"e":320,"b":0,"d":-56,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>